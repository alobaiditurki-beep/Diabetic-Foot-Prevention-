<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>KAP Diabetic Foot Prevention – 3D Interactive</title>
<style>:root{--bg:#0b1429;--tx:#F6F3EC;--gold:#E3B764;--teal:#4FB3C8;--red:#d9796a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#slide{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);width:min(1180px,92vw);max-height:78vh;overflow:auto;padding:28px 34px;background:rgba(15,28,58,.62);backdrop-filter:blur(10px);border:1px solid rgba(227,183,100,.35);border-radius:22px;opacity:0;transition:opacity .35s,transform .35s;line-height:1.55;font-size:clamp(15px,1.5vw,19px)}
#slide.in{opacity:1;transform:translate(-50%,-50%)}
h1,h2{font-family:Georgia,'Times New Roman',serif;margin:0 0 14px}h1{font-size:clamp(24px,3.2vw,42px);line-height:1.2}h2{font-size:clamp(22px,2.6vw,34px);border-bottom:3px solid var(--gold);padding-bottom:8px}
p{margin:0 0 10px}b{color:var(--gold)}.k{color:var(--gold);letter-spacing:1px;font-size:.8em}.s{opacity:.8;font-size:.9em}
.logo{background:#fff;border-radius:12px;padding:6px;height:90px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:26px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.ph{width:100%;border-radius:12px;display:block;margin-bottom:10px;max-height:230px;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:10px 0}
.card,.box{background:rgba(255,255,255,.08);border-top:4px solid var(--teal);border-radius:12px;padding:14px 16px}.card{cursor:pointer;transition:transform .2s,background .2s}.card:hover{transform:translateY(-4px) rotateX(4deg);background:rgba(255,255,255,.14)}
.card h3,.box h3{margin:0 0 6px;font-size:1.05em;color:var(--gold)}.card .more{display:none;margin-top:8px;border-top:1px solid rgba(255,255,255,.2);padding-top:8px}.card.open .more{display:block}.card:after{content:'+ details';font-size:.7em;opacity:.55}.card.open:after{content:'− less'}
.steps{display:flex;flex-direction:column;gap:6px}.step{cursor:pointer;padding:9px;border-radius:10px;text-align:center;background:#1F7A8C}.step:nth-child(3){background:#b65c4e}.step:nth-child(4){background:#26365f}.step.on{outline:2px solid var(--gold)}
table{width:100%;border-collapse:collapse;font-size:.92em}th{background:#26365f;text-align:left;padding:9px}td{padding:9px;border-bottom:1px solid rgba(255,255,255,.15)}tr:hover td{background:rgba(255,255,255,.08)}
.r{display:grid;grid-template-columns:minmax(120px,210px) 1fr 56px;gap:10px;align-items:center;margin:7px 0}.trk{background:rgba(255,255,255,.1);border-radius:8px;height:20px}.bar{height:20px;border-radius:8px;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}.bar.a{background:var(--teal)}.bar.b{background:var(--gold)}
.band{display:flex;border-radius:10px;overflow:hidden;margin-top:10px;text-align:center;font-weight:600}.band div{padding:10px}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.imgs img{width:100%;border-radius:10px;background:#fff;transition:transform .3s}.imgs img:hover{transform:scale(1.06) rotate(-1deg)}
.care{width:100%;border-radius:12px;cursor:zoom-in;transition:transform .3s}.care.z{transform:scale(1.25);cursor:zoom-out;position:relative;z-index:3}
#nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;align-items:center;z-index:5}
#nav button{background:rgba(15,28,58,.8);color:var(--tx);border:1px solid var(--gold);border-radius:999px;padding:9px 20px;font-size:15px;cursor:pointer}#nav button:hover{background:var(--gold);color:#0b1429}
#dots{display:flex;gap:6px}#dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer}#dots i.on{background:var(--gold);transform:scale(1.4)}
#top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:18px;font-size:13px;opacity:.7;z-index:5}
#lg{width:200px;height:230px;flex:none;cursor:grab;touch-action:none}#lg:active{cursor:grabbing}

.card,.box{transition:transform .15s,background .2s}.card:hover,.box:hover{background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(227,183,100,.22),transparent 60%),rgba(255,255,255,.1)}
.step{transition:transform .2s}.step:hover{transform:translateX(6px)}.step.done{box-shadow:inset 5px 0 0 var(--gold)}
#slide.hide{opacity:0!important;pointer-events:none}
#tip{position:fixed;z-index:6;pointer-events:none;padding:7px 12px;background:rgba(15,28,58,.92);border:1px solid var(--gold);border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;max-width:240px}
@media(max-width:640px){#dots{display:none}#nav button{padding:8px 14px}}

.hp,.cn{cursor:pointer}.pl{fill:none;stroke:#d9796a;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pl 1.7s infinite}.cn .pl{stroke:#4FB3C8}.cn.me .pl{stroke:#E3B764}
@keyframes pl{from{transform:scale(.8);opacity:1}to{transform:scale(2.6);opacity:0}}
.hp .dot{fill:#d9796a;transition:fill .2s}.hp:hover .dot,.hp.on .dot{fill:#E3B764}.cn .dot{fill:#4FB3C8;transition:fill .2s}.cn.me .dot{fill:#E3B764}.cn:hover .dot,.cn.on .dot{fill:#F6F3EC}
.cn text{fill:#F6F3EC;font-size:15px}

{t:'',h:'<div style="display:flex;gap:18px;align-items:center;margin-bottom:8px"><div id="lg"></div><div><p class="k">NURSING RESEARCH · NUR 413 · AL-RAYAN NATIONAL COLLEGE OF NURSING</p></div></div><h1>Knowledge, Attitudes, and Practices of Patients with Diabetes regarding the Prevention of Diabetic Foot Complications in Madinah</h1><p>Hamad Mohammed Aljohani · Basil Saad Hazza · Hassan Shaker Alobaidi · Hamza Abdulrahman Khan</p><p class="s">Supervised by Prof. Dr. Naglaa Hamdy · Dr. Abubaker Hamad · Mr. Altayeb Hasan Elkhalifa · First Semester 2026/2027</p>'},
{t:'Introduction',h:'<div class="two"><div><p>Diabetes was estimated to affect <b>589 million</b> adults aged 20–79 worldwide in 2024 (International Diabetes Federation, 2025). When sensation and circulation in the feet are reduced, even a small injury can lead to an ulcer (McDermott et al., 2023).</p><p>Around <b>18.6 million</b> people develop a diabetic foot ulcer each year, and an ulcer comes before <b>four out of five</b> lower-limb amputations in people with diabetes (Armstrong et al., 2023). Among 62,681 patients in the Saudi National Diabetes Registry, <b>3.3%</b> had a current or previous foot complication and <b>1.06%</b> had a diabetes-related amputation (Al-Rubeaan et al., 2015).</p><p>Prevention depends on regular foot checks, well-fitting shoes, patient education, and close follow-up of high-risk patients (ADA, 2026; Bus et al., 2024). This study examines what patients in Madinah know and do about this advice.</p><p class="s"><b>Key words:</b> Diabetes mellitus; Diabetic foot; Foot ulcer; Foot-care practices; Knowledge; Attitudes</p></div><div><img class="ph" src="'+IM.METER+'" alt="Measuring blood glucose"><div class="steps"><div class="step" data-i="Sensation and circulation in the feet are reduced.">Reduced sensation and circulation</div><div class="step" data-i="Even a small injury can lead to an ulcer (McDermott et al., 2023).">Minor foot injury</div><div class="step" data-i="About 18.6 million people develop a diabetic foot ulcer each year.">Diabetic foot ulcer</div><div class="step" data-i="An ulcer comes before four out of five lower-limb amputations in people with diabetes.">Lower-limb amputation</div></div><p id="si" class="s" style="margin-top:8px">Each step leads to the next.</p></div></div>'},
{t:'Preventive Foot Care',h:'<div class="two"><div><img class="care" src="'+IM.CARE+'" alt="CDC tips for healthy feet" onclick="this.classList.toggle(\'z\')"></div><div><p>Preventive care includes checking feet regularly, wearing shoes that fit, and teaching patients how to protect their feet.</p><p>These are the practices this study measures: inspection, washing, drying, nail care, footwear, and follow-up.</p><p class="s">Image: CDC, Tips for Healthy Feet.</p></div></div>'},
{t:'Where Foot Ulcers Start',h:'<div class="two"><div style="text-align:center"><svg viewBox="0 0 220 420" style="max-height:52vh;width:auto;max-width:100%"><g fill="rgba(79,179,200,.16)" stroke="#4FB3C8" stroke-width="2.5"><path d="M72 372 C46 350 52 296 62 250 C70 208 62 168 64 128 C66 104 84 94 108 94 C134 94 150 108 152 134 C154 170 150 210 148 250 C146 298 158 350 132 376 C114 392 90 392 72 372 Z"/><circle cx="80" cy="72" r="19"/><circle cx="110" cy="60" r="13"/><circle cx="130" cy="66" r="12"/><circle cx="146" cy="80" r="11"/><circle cx="158" cy="98" r="9"/></g><g class="hp" data-k="heel"><circle class="pl" cx="100" cy="362" r="9"/><circle class="dot" cx="100" cy="362" r="7"/></g><g class="hp" data-k="ball"><circle class="pl" cx="92" cy="138" r="9"/><circle class="dot" cx="92" cy="138" r="7"/></g><g class="hp" data-k="web"><circle class="pl" cx="120" cy="70" r="9"/><circle class="dot" cx="120" cy="70" r="7"/></g><g class="hp" data-k="toe"><circle class="pl" cx="80" cy="50" r="9"/><circle class="dot" cx="80" cy="50" r="7"/></g></svg></div><div id="hi"><h3 style="color:var(--gold);margin:0 0 8px">Foot risk map</h3><p>Four places where damage often begins. Select a point to see why.</p><p class="s">General explanation based on common clinical teaching; see the IWGDF prevention guidelines (Bus et al., 2024).</p></div></div>'},
{t:'Suitable Footwear',h:'<p>Guidelines recommend helping patients choose suitable footwear to prevent foot ulcers (Bus et al., 2024; Schaper et al., 2024).</p><div class="imgs"><img src="'+IM.S1+'" alt="Therapeutic shoe"><img src="'+IM.S2+'" alt="Therapeutic shoe"><img src="'+IM.S3+'" alt="Comfort shoe"></div><p class="s" style="margin-top:8px">Product examples for illustration (Fior &amp; Gentz therapeutic shoes; adjustable-strap comfort shoe).</p>'},
{t:'Research Significance',h:'<p>Amputation and death are more common among people with diabetic foot ulcers (Armstrong et al., 2023), and a planned approach to foot checks and follow-up may help prevent some amputations (Schaper et al., 2024). Saudi studies have reported different levels of foot-care knowledge and practices (Aljaouni et al., 2024; Badahdah et al., 2024; Wazqar et al., 2021).</p><p>This study focuses on patients attending the diabetes clinic of King Fahad Hospital in Madinah. It will ask what they understand about foot care, what they do at home, and what makes it hard to follow recommended care. Nurses could use the answers to plan education around the difficulties patients report.</p>'},
{t:'Research Aim and Objectives',h:'<p style="font-size:1.15em;color:var(--teal)">The aim of this study is to assess the knowledge, attitudes, and practices of adults with diabetes attending the diabetes clinic of King Fahad Hospital in Madinah regarding the prevention of diabetic foot complications.</p><div class="grid">'+C('Objective 1','Determine participants’ levels of knowledge, attitudes, and practices regarding the prevention of diabetic foot complications.','Answered with frequencies, percentages, means, and standard deviations.')+C('Objective 2','Identify barriers to daily foot care and timely professional help-seeking.','Measured with six yes/no barrier items (Part V of the questionnaire).')+C('Objective 3','Identify differences in knowledge, attitude, and practice scores according to sociodemographic and clinical characteristics.','Compared with t test, Mann–Whitney U, ANOVA, or Kruskal–Wallis (p &lt; .05).')+'</div>'},
{t:'Research Questions and Hypothesis',h:'<div class="grid">'+C('Question 1','What are the levels of knowledge, attitudes, and practices regarding the prevention of diabetic foot complications among adults with diabetes attending the diabetes clinic of King Fahad Hospital in Madinah?','Described with frequencies, percentages, means, and SDs (or medians).')+C('Question 2','What barriers prevent them from daily foot care and timely professional help-seeking?','Described with frequencies and percentages.')+C('Question 3','Are there statistically significant differences in knowledge, attitude, and practice scores according to sociodemographic and clinical characteristics?','Two groups: t test or Mann–Whitney U. Three or more: ANOVA or Kruskal–Wallis.')+'</div>'+Bx('Research hypotheses','<b>Null hypothesis (H<sub>0</sub>).</b> For each of the three outcomes (knowledge, attitude, and practice scores), there is no difference across groups defined by the sociodemographic or clinical characteristics examined.<br><br><b>Alternative hypothesis (H<sub>1</sub>).</b> At least one of the three outcomes differs between groups for at least one sociodemographic or clinical characteristic examined.')},
{t:'Literature Review',h:'<div class="grid">'+Bx('Metwally et al. (2023) · Madinah · n = 1,155','79.9% had good knowledge, yet 81.8% waited for symptoms before getting their feet checked.')+Bx('Aljaouni et al. (2024) · Madinah · n = 400','About one in three (35%) had good knowledge and about one in four (27%) had good practice.')+Bx('Wazqar et al. (2021) · Makkah · n = 409','Only 4.2% reached the good-knowledge category, 72.4% had low knowledge, and 63.3% had poor foot self-care scores.')+Bx('Badahdah et al. (2024) · Jeddah · n = 210','94.8% washed their feet daily but only 44.3% inspected them daily; 72.4% had good knowledge and 45.2% good practice.')+Bx('Alkalash et al. (2024) · Al-Qunfudah · n = 403','69.5% agreed that daily foot checks were their responsibility, yet 77.7% scored below the 80% practice cut-off; 50.4% had inadequate knowledge.')+Bx('Alsaleh et al. (2021) · Kuwait · n = 357','79.3% had good knowledge, but only 30.8% practised good foot care.')+'</div><p>Together, the studies show that knowing about foot care does not always lead to regular checks or early visits to a clinic.</p>'},
{t:'Knowledge Versus Practice',h:'<p class="s"><b>■</b> Good knowledge &nbsp; <b style="color:var(--teal)">■</b> Good practice (where reported). Cut-offs differ between studies.</p>'+[['Metwally 2023, Madinah',79.9,0],['Aljaouni 2024, Madinah',35,27],['Wazqar 2021, Makkah',4.2,0],['Badahdah 2024, Jeddah',72.4,45.2],['Alsaleh 2021, Kuwait',79.3,30.8]].map(x=>R(x[0],x[1],'b')+(x[2]?R('',x[2],'a'):'')).join('')+'<p class="s">Alkalash 2024 (Al-Qunfudah) reported 50.4% inadequate knowledge and 77.7% below its practice cut-off, so it is not plotted.</p>'},
{t:'Studies Across Cities',h:'<div class="two"><div><svg viewBox="0 0 480 480" style="width:100%;max-height:56vh"><g stroke="rgba(255,255,255,.07)"><line x1="40" y1="0" x2="40" y2="480"/><line x1="100" y1="0" x2="100" y2="480"/><line x1="160" y1="0" x2="160" y2="480"/><line x1="220" y1="0" x2="220" y2="480"/><line x1="280" y1="0" x2="280" y2="480"/><line x1="340" y1="0" x2="340" y2="480"/><line x1="400" y1="0" x2="400" y2="480"/><line x1="460" y1="0" x2="460" y2="480"/><line x1="0" y1="40" x2="480" y2="40"/><line x1="0" y1="100" x2="480" y2="100"/><line x1="0" y1="160" x2="480" y2="160"/><line x1="0" y1="220" x2="480" y2="220"/><line x1="0" y1="280" x2="480" y2="280"/><line x1="0" y1="340" x2="480" y2="340"/><line x1="0" y1="400" x2="480" y2="400"/><line x1="0" y1="460" x2="480" y2="460"/></g><g stroke="rgba(227,183,100,.35)" stroke-dasharray="5 6" fill="none"><line x1="84" y1="228" x2="94" y2="345"/><line x1="84" y1="228" x2="67" y2="339"/><line x1="84" y1="228" x2="143" y2="431"/><line x1="84" y1="228" x2="420" y2="41"/></g><g class="cn me" data-k="madinah"><circle class="pl" cx="84" cy="228" r="9"/><circle class="dot" cx="84" cy="228" r="7"/><text x="96" y="233" text-anchor="start">Madinah</text></g><g class="cn" data-k="makkah"><circle class="pl" cx="94" cy="345" r="9"/><circle class="dot" cx="94" cy="345" r="7"/><text x="106" y="350" text-anchor="start">Makkah</text></g><g class="cn" data-k="jeddah"><circle class="pl" cx="67" cy="339" r="9"/><circle class="dot" cx="67" cy="339" r="7"/><text x="55" y="344" text-anchor="end">Jeddah</text></g><g class="cn" data-k="qunfudah"><circle class="pl" cx="143" cy="431" r="9"/><circle class="dot" cx="143" cy="431" r="7"/><text x="155" y="436" text-anchor="start">Al-Qunfudah</text></g><g class="cn" data-k="kuwait"><circle class="pl" cx="420" cy="41" r="9"/><circle class="dot" cx="420" cy="41" r="7"/><text x="408" y="46" text-anchor="end">Kuwait</text></g></svg><p class="s">Schematic map, not to scale. Gold: site of the present study.</p></div><div id="cp"><h3 style="color:var(--gold);margin:0 0 8px">Select a city</h3><p>Each city shows the results of the study reviewed from there.</p></div></div>'},
{t:'Research Gap',h:'<p style="font-size:1.15em;color:var(--teal)">Knowing about foot care does not always lead to regular checks or early clinic visits.</p><p>The two Madinah studies provide information on knowledge and practices, but give little detail on why patients miss daily care or delay seeking help. A Cochrane review also found limited evidence that a short education programme on its own reduces ulcers or amputations.</p>'+R('Good knowledge, Kuwait',79.3,'b')+R('Good practice, Kuwait',30.8,'a')+'<p>This study will therefore ask about these barriers together with knowledge, attitudes, and foot-care practices among adults attending the diabetes clinic of King Fahad Hospital.</p>'},
{t:'Design, Setting and Sampling',h:'<div class="two"><div><p>A quantitative descriptive survey with a cross-sectional approach will describe current knowledge, attitudes, practices, and barriers at a single point in time, without any intervention. It will be conducted in the outpatient diabetes clinic of King Fahad Hospital, a Ministry of Health hospital in Madinah.</p><p>The sample of <b>400</b> adults will be selected systematically by inviting every second patient on the daily clinic list, across different weekdays and sessions over about two months. Participants complete an Arabic questionnaire on a smartphone through Google Forms after scanning a QR code, in about 10 minutes; a family member or researcher helps patients who cannot read or use a smartphone.</p></div><div><img class="ph" style="max-height:none" src="'+IM.HOSP+'" alt="King Fahad Hospital, Madinah"><p class="s">King Fahad Hospital, Madinah (image: SPA)</p></div></div>'},
{t:'Inclusion and Exclusion Criteria',h:'<div class="grid">'+Bx('Inclusion','Eligible participants are adults aged 18 years or older with a confirmed diagnosis of type 1 or type 2 diabetes for at least six months, attending the outpatient diabetes clinic of King Fahad Hospital during the data collection period, who can communicate in Arabic and are willing to give informed consent.')+Bx('Exclusion','Patients are excluded if they have gestational diabetes only, a severe acute illness or a cognitive or psychiatric condition that prevents informed responses, or if they took part in the pilot study.')+'</div>'},
{t:'Study Tools',h:'<div class="grid">'+C('Part I · Sociodemographic and clinical','Background data','Age, sex, education, occupation, type and duration of diabetes, history of foot ulcer or amputation, and previous foot-care education.')+C('Part II · Knowledge','10 items','Risk factors, warning signs, and preventive foot care; True / False / Don’t know; one point per correct answer.')+C('Part III · Attitudes','6 items','Five-point Likert scale (strongly agree = 5 to strongly disagree = 1); two negatively worded items are reverse-scored.')+C('Part IV · Practices','10 items','Foot inspection, washing, drying, nail care, footwear, and follow-up; five-point frequency scale (always = 5 to never = 1); three items reverse-scored.')+C('Part V · Barriers','6 yes/no items','Barriers to foot care.')+'</div><div class="band"><div style="flex:2;background:#b65c4e">Poor (&lt;50%)</div><div style="flex:1;background:#E3B764;color:#0b1429">Fair (50–75%)</div><div style="flex:1;background:#1F7A8C">Good (&gt;75%)</div></div><p class="s" style="margin-top:6px">Scores as percentages (Badahdah et al., 2024); attitudes: negative, fair, positive.</p>'},
{t:'Validity, Pilot Study and Procedure',h:'<div class="grid">'+Bx('Validity and pilot study','Five experts in diabetes care, nursing, and research methods will review the questionnaire for content validity. A pilot study on about 10% of the sample (40 eligible participants) will test the clarity of the questionnaire, the time needed, and the feasibility of data collection. Internal consistency will be assessed with Cronbach’s alpha (acceptable at .70 or above) for attitudes and practices, and with KR-20 for the knowledge items. Pilot participants will not be included in the main study.')+Bx('Data collection procedure','After ethical approval and hospital permission, the team coordinates data collection days with the head nurse, screens eligibility from the daily clinic list, and selects participants systematically. Each selected patient receives an explanation of the study and a QR code, with consent recorded on the first page of the form, then completes the questionnaire on a smartphone with help if needed. Responses are checked daily in Google Sheets and kept in a password-protected file.')+'</div>'},
{t:'Ethical Approvals and Data Analysis',h:'<div class="grid">'+Bx('Ethical approvals','The proposal will be submitted to the college’s Research Ethics Committee and to the IRB responsible for King Fahad Hospital, with permission from the hospital administration. Consent will be obtained electronically after explaining the purpose, voluntary participation, and the right to withdraw without affecting care. No names or contact details will be collected, data will be password-protected, and patients with urgent foot problems will be referred to their physician. The study follows the Declaration of Helsinki.')+Bx('Data analysis','Responses will be exported from Google Sheets to IBM SPSS Statistics, coded, and cleaned. Normality will be judged from histograms, skewness, and kurtosis. Frequencies, percentages, means, and standard deviations (or medians for skewed data) will answer the first two questions. For the third, the independent-samples t test or Mann–Whitney U test will compare two groups, and one-way ANOVA or the Kruskal–Wallis test three or more, with significance set at p &lt; .05.')+'</div>'},
{t:'Summary',h:'<p>This descriptive cross-sectional survey will assess the knowledge, attitudes, and practices of 400 adults attending the diabetes clinic of King Fahad Hospital in Madinah regarding the prevention of diabetic foot complications, and will identify the barriers to daily foot care and timely help-seeking. The results will describe score levels and show differences by sociodemographic and clinical characteristics, so that nurses can plan education around the difficulties patients report.</p><div class="grid">'+C('Aim','','Knowledge, attitudes, practices, and barriers.')+C('Design','','Cross-sectional descriptive survey.')+C('Sample','','400 adults, systematic sampling.')+C('Tools','','Five-part Arabic questionnaire.')+C('Analysis','','SPSS; significance at p &lt; .05.')+'</div>'},
{t:'Key References',h:'<p class="s">Aljaouni et al. (2024). Healthcare, 12(13), 1244. · Alkalash et al. (2024). Cureus, 16(1), e53356. · Alsaleh et al. (2021). Saudi Pharm J, 29(6), 506–515. · Armstrong et al. (2023). JAMA, 330(1), 62–75. · Badahdah et al. (2024). Cureus, 16(3), e55826. · Bus et al. (2024). IWGDF prevention guidelines. Diabetes Metab Res Rev, 40(3). · Metwally et al. (2023). Cureus, 15(12), e49933. · Schaper et al. (2024). IWGDF practical guidelines. Diabetes Metab Res Rev, 40(3). · Wazqar et al. (2021). Pan Afr Med J, 40, 123. · ADA PPC (2026). Standards of Care in Diabetes. Diabetes Care, 49(Suppl. 1).</p><p>The complete reference list is in the research paper.</p>'}];
const HP={heel:['Heel','The heel takes the first load of every step and rubs against the back of the shoe. With dry, cracked skin and reduced sensation, a small fissure or blister can go unnoticed. In people who rest in bed for long periods, constant pressure on the heel can also break the skin.','daily inspection and well-fitting footwear.'],
ball:['Ball of the foot','Pressure is highest under the bones at the base of the toes when walking. Reduced sensation and foot deformities can raise it further, and a callus often forms first. A callus left alone can break down into an ulcer.','footwear, inspection, and follow-up with the care team.'],
web:['Between the toes','Feet that are not dried well between the toes stay damp. The skin softens and splits, and infection can enter through the cracks. It is a hidden area, so damage is easily missed without looking carefully.','washing and drying, and daily inspection.'],
toe:['Toes and nails','Tight shoes rub the tips and tops of the toes, and cutting nails too short or too round can nick the skin. Reduced sensation means the injury may not be felt.','nail care and suitable footwear.']};
